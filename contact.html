<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - iPhone</title>
    <link rel="stylesheet" href="main.css">
</head>


<body>

    <!-- 1. Le menu et les drapeaux centrés en haut -->
    <nav class="menu-centre">
        <a href="index.html">Accueil</a>
        <a href="thematique.html">Thématique</a>
        <a href="modeles.html">Modèles</a>
        <a href="galerie.html">Galerie</a>
        <a href="histoire.html">Histoire</a>
        <a href="contact.html">Contact</a>
        <span class="separateur">|</span>
        <a href="CV_FR.html">
            <img src="https://flagcdn.com/w20/fr.png" alt="Drapeau France" class="icone-drapeau">CV 
        </a>
        <a href="CV_EN.html">
            <img src="https://flagcdn.com/w20/gb.png" alt="Drapeau Royaume-Uni" class="icone-drapeau">CV
        </a>
    </nav>

    <!-- 2. TITRE PRINCIPAL -->
    <h1 class="titre-page">Me contacter</h1>

    <!-- 3. CONTENU CENTRAL -->
    <main class="cv-centrage">
        <div id="SousMenuA" class="conteneur-central">

            <!-- BLOC DU FORMULAIRE -->
            <div class="bloc-info">

                <h2 class="titre-centre">Formulaire de contact</h2>

                <!-- Utilisation exclusive des classes CSS pour le design -->
                <form action="#" method="get" class="formulaire-contact">

                    <p class="groupe-formulaire">
                        <label for="nom" class="label-formulaire">Nom :</label>
                        <input type="text" id="nom" name="nom" required class="champ-formulaire">
                    </p>

                    <p class="groupe-formulaire">
                        <label for="mail" class="label-formulaire">Mail :</label>
                        <input type="email" id="mail" name="mail" required class="champ-formulaire">
                    </p>

                    <p class="groupe-formulaire">
                        <label for="age" class="label-formulaire">Âge :</label>
                        <input type="number" id="age" name="age" required class="champ-formulaire">
                    </p>

                    <p class="groupe-formulaire-dernier">
                        <label for="sexe" class="label-formulaire">Sexe :</label>
                        <select id="sexe" name="sexe" class="champ-formulaire">
                            <option value="homme">Homme</option>
                            <option value="femme">Femme</option>
                        </select>
                    </p>

                    <p class="bouton-conteneur">
                        <input type="submit" value="Envoyer" class="bouton-envoyer">
                    </p>

                </form>

            </div>
        </div>
    </main>

</body>

</html>
