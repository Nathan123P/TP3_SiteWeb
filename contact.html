<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - iPhone</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <!-- 1. Le menu et les drapeaux centrés en haut -->
    <nav class="menu-centre">
        <a href="index.html">Accueil</a>
        <a href="thematique.html">Thématique</a>
        <a href="modeles.html">Modèles</a>
        <a href="galerie.html">Galerie</a>
        <a href="contact.html">Contact</a>
        <span class="separateur">|</span>
        <a href="CV_FR.html">🇫🇷 FR</a>
        <a href="CV_EN.html">🇬🇧 EN</a>
    </nav>

    <!-- 2. Le titre principal -->
    <h1 class="titre-page">Me contacter</h1>

    <!-- 3. Le conteneur pour centrer le contenu -->
    <main class="cv-centrage">
        <div id="SousMenuA" style="width: 80%; text-align: center;">
            <div class="titre-contenu">
                
                <h2>Formulaire de contact</h2>
                
                <!-- Nom, Mail, Age, Sexe : Contraintes du projet respectées -->
                <form action="#" method="get" style="display: inline-block; text-align: left; margin-top: 20px;">
                    <p>
                        <label for="nom">Nom :</label><br>
                        <input type="text" id="nom" name="nom" required style="width: 100%; padding: 5px;">
                    </p>
                    <p>
                        <label for="mail">Mail :</label><br>
                        <input type="email" id="mail" name="mail" required style="width: 100%; padding: 5px;">
                    </p>
                    <p>
                        <label for="age">Âge :</label><br>
                        <input type="number" id="age" name="age" required style="width: 100%; padding: 5px;">
                    </p>
                    <p>
                        <label for="sexe">Sexe :</label><br>
                        <select id="sexe" name="sexe" style="width: 100%; padding: 5px;">
                            <option value="homme">Homme</option>
                            <option value="femme">Femme</option>
                        </select>
                    </p>
                    <p style="text-align: center; margin-top: 20px;">
                        <input type="submit" value="Envoyer" style="padding: 10px 20px; cursor: pointer;">
                    </p>
                </form>

            </div>
        </div>
    </main>

</body>
</html>
